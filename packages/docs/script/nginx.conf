server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ── 缓存策略 ──────────────────────────────────────────────────────────────
    # Vite 产物 /assets/* 文件名含 hash，永久缓存
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证部署后立即生效
    location = /index.html {
        expires     -1;
        add_header  Cache-Control "no-store";
    }

    # ── SPA 路由回退 ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
