services:
  zui-docs:
    build:
      context: ..
      dockerfile: script/Dockerfile
    image: zui-docs
    ports:
      - '4173:80'
    environment:
      - TZ=Asia/Shanghai
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - baota_net

networks:
  baota_net:
    external: true

# 部署流程（在仓库根目录先打包 dist，再用本文件构建/启动）：
#  pnpm --filter @kenconnet666/docs run build
#  docker compose -f packages/docs/script/docker-compose.yaml -p script up -d --build
#  docker compose -f packages/docs/script/docker-compose.yaml -p script down
#  docker compose -f packages/docs/script/docker-compose.yaml -p script logs -f
